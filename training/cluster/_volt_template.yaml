
apiVersion: batch/v1
kind: Job
metadata:
  generateName: __TEMPLATE_USER__-__TEMPLATE_PROJECT__-
  labels:
    user: __TEMPLATE_USER__
    app: __TEMPLATE_PROJECT__
    team: graphcore
spec:
  parallelism: 1
  completions: 1
  completionMode: Indexed
  backoffLimitPerIndex: 0  # maximal number of failures per index
  ttlSecondsAfterFinished: 7200
  template:
    spec:
      # Pass dictionary, e.g. {nvidia.com/gpu.clique: clique-id}
      nodeSelector: __TEMPLATE_NODE_SELECTOR__
      containers:
      - name: worker
        image: nvidia/cuda:12.9.1-cudnn-devel-ubuntu22.04
        env: __TEMPLATE_ENV__
        command:
          - bash
          - -c
          - |
            base64 -d > ~/job.pkl <<'__B64__'
            __TEMPLATE_JOB__
            __B64__
            apt-get update
            apt-get install -y build-essential git curl unzip python3-dev python3.10-venv
            curl https://awscli.amazonaws.com/awscli-exe-linux-aarch64.zip -o awscliv2.zip
            unzip -q awscliv2.zip
            ./aws/install
            rm -rf ./aws awscliv2.zip
            cd ~
            git -c url."https://${GITHUB_TOKEN}@github.com/".insteadOf=git@github.com: clone --recursive https://${GITHUB_TOKEN}@github.com/graphcore-research/squashed-llama.git
            cd squashed-llama/training
            git checkout --recurse-submodules ${GIT_COMMIT}
            python3 -m venv .venv
            echo "export PYTHONPATH=\${PYTHONPATH}:\$(dirname \${VIRTUAL_ENV})/optimal_weight_formats" >> .venv/bin/activate
            source .venv/bin/activate
            pip install --upgrade pip wheel
            pip install -r requirements.txt
            python cluster/_run_job.py
        resources:
          requests:
            nvidia.com/gpu: __TEMPLATE_GPUS__
            memory: __TEMPLATE_MEMORY__
            cpu: __TEMPLATE_CPUS__
          limits:
            nvidia.com/gpu: __TEMPLATE_GPUS__
            memory: __TEMPLATE_MEMORY__
            cpu: __TEMPLATE_CPUS__
        ports:
        - containerPort: 8888
          name: notebook
      restartPolicy: Never
